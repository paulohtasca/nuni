<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuni</title>
<meta name="apple-mobile-web-app-title" content="Nuni">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffe3ee">
<script>
  // Endereço do app. Se o link mudar, troque só esta linha.
  var APP = 'https://claude.ai/artifact/P6zhLKHEsx8nCKrGX997vn';
  // Depois da primeira visita, abrir pela Tela de Início leva direto ao app.
  // Para ver esta página de novo, abra o endereço com ?config no final.
  try {
    var setup = /[?&]config\b/.test(location.search);
    if (!setup && localStorage.getItem('nuni-pronto') === '1') location.replace(APP);
  } catch (e) {}
</script>
<style>
  :root{--bg:#fff4f3;--ink:#3a2a3f;--muted:#86758b;--pink:#c93d70}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#ffe3ee,#efe8ff);font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink)}
  main{width:min(380px,100%);background:#fff;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 24px 50px -24px rgba(120,40,90,.45)}
  img{width:110px;height:110px;border-radius:26px;box-shadow:0 10px 24px -10px rgba(120,40,90,.5)}
  h1{font-size:26px;margin:14px 0 4px}
  p{margin:0 0 16px;color:var(--muted)}
  ol{text-align:left;margin:0 0 20px;padding-left:22px}
  li{margin:6px 0}
  b{color:var(--ink)}
  a.btn{display:block;padding:14px;border-radius:999px;background:linear-gradient(135deg,#ff7aa8,#b48cf0);color:#fff;font-weight:800;text-decoration:none}
  .share{display:inline-block;width:18px;height:18px;vertical-align:-3px}
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="Ícone da Nuni">
  <h1>Rotina da Nuni</h1>
  <p>Coloque o app na tela de início, com o ícone e o nome já prontos:</p>
  <ol>
    <li>Toque em <b>Compartilhar</b> <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg> na barra do Safari.</li>
    <li>Escolha <b>Adicionar à Tela de Início</b>.</li>
    <li>Toque em <b>Adicionar</b>.</li>
  </ol>
  <a class="btn" id="go" href="#">Abrir o app agora</a>
</main>
<script>
  try { localStorage.setItem('nuni-pronto', '1'); } catch (e) {}
  document.getElementById('go').href = APP;
</script>
</body>
</html>
